<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    A waveform, because that is what this product is: sound you can point at.
    Five bars rather than a literal glyph — legible at 16px, where detail disappears.
  -->
  <rect width="32" height="32" rx="7.5" fill="#0a0a0c"/>
  <g fill="#2e9bf0">
    <rect x="5"    y="13"   width="3" height="6"    rx="1.5"/>
    <rect x="10"   y="9"    width="3" height="14"   rx="1.5"/>
    <rect x="15"   y="5.5"  width="3" height="21"   rx="1.5"/>
    <rect x="20"   y="10.5" width="3" height="11"   rx="1.5"/>
    <rect x="25"   y="14"   width="3" height="4"    rx="1.5"/>
  </g>
</svg>
